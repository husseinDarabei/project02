<!DOCTYPE html>
<html lang="en">
<head>
<title>CSS Colors</title>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
</head>

<body>
<h1>CSS Colors</h1>
<h2>Color Palette<h2>
<div class="Color platte"> 
<div class="swatch named">Named: red/</div>
<div class="swatch hex">Hex: #008000</div>
<div class="swatch rgb">RGB: rgb(0, 0, 255)</div>
<div class="swatch rgba">RGBA: rgba(255, 0, 0, 0.5)</div>
</div>
<h2>Opacity vs RGBA</h2>

<div class="opacity-box">
<p>This box use opacity: 0.5</p>
<span>Child text is also transparent</span>
</div>

<div class="rgba-box">
<p>This box uses RGBA background</p>
<span>Child text remains opaque</span>
</div>

</body>
</html>
